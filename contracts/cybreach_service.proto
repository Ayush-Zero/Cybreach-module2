syntax = "proto3";

package cybreach.services;

option py_generic_services = true;

// ============ Connector Registry (Pod Alpha)
service ConnectorRegistryService {
  rpc RegisterConnector(RegisterConnectorRequest) returns (RegisterConnectorResponse);
  rpc GetConnectorHealth(GetConnectorHealthRequest) returns (GetConnectorHealthResponse);
  rpc ListConnectors(ListConnectorsRequest) returns (ListConnectorsResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ============ Normalization Service (Pod Gamma)
service NormalizationService {
  rpc Normalize(NormalizeRequest) returns (NormalizeResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ============ Revalidation Service (Pod Gamma)
service RevalidationService {
  rpc Revalidate(RevalidateRequest) returns (RevalidateResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ============ Verdict Publisher Service (Pod Delta)
service VerdictPublisherService {
  rpc PublishVerdict(PublishVerdictRequest) returns (PublishVerdictResponse);
  rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ============ Common Messages
message HealthRequest {
  string service_name = 1;
}

message HealthResponse {
  string status = 1;
  string service = 2;
  int64 timestamp = 3;
  string version = 4;
}

// ============ Connector Registry Messages
message RegisterConnectorRequest {
  string tenant_id = 1;
  string connector_id = 2;
  string connector_type = 3;  // e.g., "splunk", "elastic", "sentinel", "qradar", "crowdstrike"
  string name = 4;
  bytes configuration = 5;    // connector-specific config as JSON bytes
}

message RegisterConnectorResponse {
  string connector_id = 1;
  bool registered = 2;
  string status = 3;          // e.g., "ok", "error"
  string error_detail = 4;
}

message GetConnectorHealthRequest {
  string connector_id = 1;
}

message ConnectorHealthInfo {
  string connector_id = 1;
  string name = 2;
  string status = 3;          // e.g., "healthy", "degraded", "unavailable"
  int64 last_checked = 4;     // unix timestamp
  int64 total_requests = 5;
  int64 successful_requests = 6;
  int64 failed_requests = 7;
  double avg_latency_ms = 8;
}

message GetConnectorHealthResponse {
  ConnectorHealthInfo connector = 1;
  string error_detail = 2;
}

message ListConnectorsRequest {
  string tenant_id = 1;
}

message ListConnectorsResponse {
  repeated ConnectorHealthInfo connectors = 1;
}

// ============ Normalization Messages (Gamma)
message NormalizeRequest {
  string tenant_id = 1;
  string evidence_id = 2;
  string source_format = 3;
  bytes raw_data = 4;
}

message NormalizeResponse {
  string evidence_id = 1;
  bytes normalized_event = 2;
  string status = 3;
  string error_detail = 4;
}

// ============ Revalidation Messages (Gamma)
message RevalidateRequest {
  string tenant_id = 1;
  string verdict_id = 2;
  bytes evidence_data = 3;
  repeated string original_rules = 4;
}

message RevalidateResponse {
  string verdict_id = 1;
  bool still_valid = 2;
  repeated string current_rules = 3;
  string status = 4;
  string gap_closed = 5;
}

// ============ Verdict Publisher Messages (Delta)
message PublishVerdictRequest {
  string tenant_id = 1;
  string action_id = 2;
  string verdict_id = 3;
  string verdict = 4;
  double confidence = 5;
  bytes normalized_event = 6;
  repeated string regulatory_control_refs = 7;
}

message PublishVerdictResponse {
  string verdict_id = 1;
  string status = 2;
  bool accepted = 3;
  string error_detail = 4;
}
